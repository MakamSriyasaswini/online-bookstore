<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner Online Bookstore</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>📚 PageTurner Bookstore</h1>
        <nav>
            <a href="#catalog">Books</a>
            <a href="#orders">Track Order</a>
            <button id="cart-toggle">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <section class="hero">
        <p>YOUR NEXT CHAPTER STARTS HERE</p>
        <h2>Discover your next<br>favorite book.</h2>
        <a href="#catalog" class="cta">Explore Books →</a>
    </section>

    <main>
        <section id="catalog">
            <h2>Our Book Collection</h2>
            <div class="toolbar">
                <input id="search" type="search"
                       placeholder="Search by title or author..."
                       aria-label="Search books">
                <select id="category" aria-label="Filter category">
                    <option value="All">All Categories</option>
                    <option>Fiction</option>
                    <option>Technology</option>
                    <option>Personal Growth</option>
                    <option>Mystery</option>
                    <option>Fantasy</option>
                </select>
            </div>
            <p id="result-count"></p>
            <div id="book-grid" class="book-grid"></div>
        </section>

        <section id="orders">
            <h2>Track Your Order</h2>
            <form id="tracking-form">
                <input id="order-id" placeholder="Enter order ID" required>
                <button type="submit">Track Order</button>
            </form>
            <p id="tracking-result" role="status"></p>
        </section>
    </main>

    <aside id="cart-panel" aria-hidden="true">
        <button id="cart-close" aria-label="Close cart">✕</button>
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: <span id="cart-total">$0.00</span></h3>
        <button id="checkout">Place Demo Order</button>
        <p id="checkout-message" role="status"></p>
        <p>Demo checkout only. No payment is collected.</p>
    </aside>

    <div id="overlay"></div>

    <footer>
        <p>© 2026 PageTurner Bookstore | Happy Reading!</p>
    </footer>
</body>
</html>
