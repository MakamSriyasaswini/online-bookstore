apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
  labels:
    app: online-bookstore
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: online-bookstore
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: bookstore
          image: makamsriya/online-bookstore:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: online-bookstore-service
spec:
  type: NodePort
  selector:
    app: online-bookstore
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30014
